<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM2.5 Watch · เขตสุขภาพที่ 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- แผนที่: Leaflet + OpenStreetMap (ฟรี ไม่ต้องใช้ API key / ไม่ต้องผูกบัญชีเรียกเก็บเงิน)
     เปลี่ยนมาจาก Google Maps เมื่อ ก.ย. 2569 เพราะ billing หลุด -> BillingNotEnabledMapError -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script>
// โหลดไฟล์ข้อมูล + โค้ดแบบกัน cache (เติม timestamp ท้าย URL)
//  - ไฟล์ข้อมูล: รีเฟรชธรรมดาก็ได้ข้อมูลใหม่เสมอ
//  - ไฟล์ .jsx : deploy โค้ดใหม่แล้วผู้ใช้เห็นทันที ไม่ค้างโค้ดเก่าใน cache เบราว์เซอร์
//    (ลำดับสำคัญ: components -> pages -> app)
(function () {
  var v = Date.now();
  ['data.js', 'heat-data.js', 'pm-hourly.js'].forEach(function (f) {
    document.write('<script src="' + f + '?v=' + v + '"><\/script>');
  });
  ['components.jsx', 'page-overview.jsx', 'page-compare.jsx', 'page-districts.jsx', 'page-heat.jsx', 'app.jsx'].forEach(function (f) {
    document.write('<script type="text/babel" src="' + f + '?v=' + v + '"><\/script>');
  });
})();
</script>
</body>
</html>
